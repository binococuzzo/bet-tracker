<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bet Tracker">
<title>Bet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1014; --panel: #151920; --panel2: #1b2029; --panel3: #222835; --line: #2a303c; --line2: #353d4c;
  --text: #e8ebf1; --muted: #8c95a6; --faint: #5d6576;
  --accent: #6d9bff; --accent-ink: #0b1430; --accent-soft: rgba(109,155,255,.14);
  --win: #33c27a; --win-soft: rgba(51,194,122,.14); --loss: #f05b5b; --loss-soft: rgba(240,91,91,.14);
  --push: #d4ae3a; --push-soft: rgba(212,174,58,.15); --pending: #8c95a6; --cashed: #43b8d0; --cashed-soft: rgba(67,184,208,.14);
  --warn: #f0a33a; --warn-soft: rgba(240,163,58,.14); --live: #ff4d6d;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --f-num: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-text: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f5f8; --panel: #ffffff; --panel2: #f7f8fb; --panel3: #eef0f5; --line: #e1e4eb; --line2: #cfd4de;
  --text: #151922; --muted: #5f6878; --faint: #8f97a6;
  --accent: #2f63e0; --accent-ink: #ffffff; --accent-soft: rgba(47,99,224,.1);
  --win: #178a52; --win-soft: rgba(23,138,82,.1); --loss: #d23a3a; --loss-soft: rgba(210,58,58,.09);
  --push: #a57f0c; --push-soft: rgba(165,127,12,.1); --pending: #6b7384; --cashed: #1c8aa3; --cashed-soft: rgba(28,138,163,.1);
  --warn: #c7740c; --warn-soft: rgba(199,116,12,.1); --live: #e0224a; --shadow: 0 10px 30px rgba(20,25,40,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f8; --panel: #ffffff; --panel2: #f7f8fb; --panel3: #eef0f5; --line: #e1e4eb; --line2: #cfd4de;
    --text: #151922; --muted: #5f6878; --faint: #8f97a6;
    --accent: #2f63e0; --accent-ink: #ffffff; --accent-soft: rgba(47,99,224,.1);
    --win: #178a52; --win-soft: rgba(23,138,82,.1); --loss: #d23a3a; --loss-soft: rgba(210,58,58,.09);
    --push: #a57f0c; --push-soft: rgba(165,127,12,.1); --pending: #6b7384; --cashed: #1c8aa3; --cashed-soft: rgba(28,138,163,.1);
    --warn: #c7740c; --warn-soft: rgba(199,116,12,.1); --live: #e0224a; --shadow: 0 10px 30px rgba(20,25,40,.12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--f-text); }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font: 700 22px/1 var(--f-num); letter-spacing: .02em; text-transform: uppercase; }
.brand .build { font: 11px var(--f-mono); color: var(--faint); }
.hbtns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line2); background: var(--panel2); border-radius: 8px; padding: 6px 11px; font-weight: 500; font-size: 13px; transition: background .12s, border-color .12s; white-space: nowrap; }
.btn:hover { background: var(--panel3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--loss); }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel3); }
.btn:disabled { opacity: .5; cursor: default; }
.savechip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600; border: 1px solid var(--line2); background: var(--panel2); }
.savechip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.savechip.ok .dot { background: var(--win); } .savechip.ok { color: var(--win); }
.savechip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); } .savechip.warn .dot { background: var(--warn); }
.savechip.bad { color: #fff; background: var(--loss); border-color: var(--loss); } .savechip.bad .dot { background: #fff; }
.cloudchip.ok { color: var(--win); border-color: color-mix(in srgb, var(--win) 45%, transparent); }
.cloudchip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sync .spin { width: 10px; height: 10px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* banners */
.banner { margin: 10px 0 0; border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 500; }
.banner.bad { background: var(--loss); color: #fff; }
.banner.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
.banner.info { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.banner .grow { flex: 1; min-width: 200px; }

/* entry */
.entry { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
#entry { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel2); padding: 12px 14px; font-size: 18px; line-height: 1.4; outline: none; }
#entry:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.hint kbd { font: 11px var(--f-mono); background: var(--panel3); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
.preview { margin-top: 12px; }
.preview:empty { display: none; }
.pv-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pv-legs { margin-top: 8px; display: grid; gap: 6px; }
.pv-leg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
.pv-leg .legno { font: 600 11px var(--f-mono); color: var(--faint); margin-right: 2px; }
.fchip { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 9px; border-radius: 7px; background: var(--panel3); border: 1px solid var(--line2); font-size: 13px; cursor: pointer; }
.fchip:hover { border-color: var(--accent); }
.fchip .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
.fchip .v { font-weight: 600; }
.fchip.missing { border-color: var(--warn); background: var(--warn-soft); }
.fchip.missing .v { color: var(--warn); }
.fchip.on { border-color: var(--accent); background: var(--accent-soft); }
.pv-foot { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.conf { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.conf .bar { width: 90px; height: 6px; background: var(--panel3); border-radius: 3px; overflow: hidden; }
.conf .bar i { display: block; height: 100%; background: var(--win); }
.conf.low .bar i { background: var(--loss); } .conf.mid .bar i { background: var(--warn); }
.issues { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.issues li { font-size: 13px; color: var(--warn); }
.issues li::before { content: '⚠ '; }
.pv-leg.unsure { border-color: var(--warn); }
.issues-inline { font-size: 12.5px; color: var(--warn); }
.poscheck { margin-top: 10px; padding: 9px 12px; border-radius: 9px; font-size: 13px; border: 1px solid var(--line2); background: var(--panel2); }
.poscheck.middle { border-color: color-mix(in srgb, var(--win) 50%, transparent); background: var(--win-soft); }
.poscheck.dup { border-color: var(--warn); background: var(--warn-soft); }
.poscheck.dup b { color: var(--warn); }
.poscheck.reverse { border-color: var(--loss); background: var(--loss-soft); color: var(--loss); font-weight: 600; }
.editor { position: absolute; z-index: 60; background: var(--panel); border: 1px solid var(--line2); box-shadow: var(--shadow); border-radius: 10px; padding: 8px; display: flex; gap: 6px; align-items: center; }
.editor input, .editor select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; min-width: 150px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; min-width: 0; }
.tile .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.tile .val { font: 600 28px/1.15 var(--f-num); font-variant-numeric: tabular-nums; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.tile-wide { grid-column: span 2; }
@media (max-width: 520px) { .tile-wide { grid-column: auto; } .tile-wide .val { font-size: 21px; } }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-top: 14px; overflow: hidden; }
.panel-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head h2 { margin: 0 auto 0 0; font: 700 17px/1 var(--f-num); text-transform: uppercase; letter-spacing: .04em; }
.panel-body { padding: 12px 14px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 8px; font-size: 13px; max-width: 170px; }
.filters input[type=search] { width: 170px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel2); padding: 5px 10px; font-size: 12.5px; border-right: 1px solid var(--line2); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.range-pick { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.range-pick label { display: inline-flex; gap: 5px; align-items: center; }

/* table */
.table-wrap { overflow-x: auto; }
th.selc, td.selc { width: 28px; padding-right: 0; cursor: default; }
.selc input { width: 16px; height: 16px; cursor: pointer; margin: 2px 0 0; }
tbody tr.sel td { background: var(--accent-soft); }
.bulkbar { position: sticky; top: 64px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; margin-bottom: 8px;
  border: 1px solid var(--accent); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow, 0 6px 20px rgba(0,0,0,.25)); }
.bulkbar label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.bulkbar select, .bulkbar input { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 4px 7px; font-size: 13px; color: var(--text); }
.bulkbar input { width: 150px; }
.bulkbar .count { font-weight: 600; }
@media (max-width: 700px) { .bulkbar { top: 0; } .bulkbar input { width: 120px; } }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--panel2); position: sticky; top: 0; white-space: nowrap; }
th.r, td.r { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel2); }
tr.review td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.leg-line { font-weight: 600; }
.leg-line + .leg-line { margin-top: 2px; }
.meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--panel3); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.live { background: var(--live); color: #fff; border-color: var(--live); }
.tag.hedge { background: var(--cashed-soft); color: var(--cashed); border-color: transparent; }
.tag.src { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.tag.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.tag.clv-pos { color: var(--win); background: var(--win-soft); border-color: transparent; }
.tag.clv-neg { color: var(--loss); background: var(--loss-soft); border-color: transparent; }
.tag.mid { color: var(--win); background: var(--win-soft); border-color: transparent; }
.tag.lock { color: var(--win); background: var(--win-soft); border-color: transparent; }
.tag.rev { color: var(--loss); background: var(--loss-soft); border-color: transparent; }
.game { font-size: 13px; }
.game .sc { font: 600 15px var(--f-num); font-variant-numeric: tabular-nums; }
.game .st { font-size: 12px; color: var(--muted); }
.game .st.live { color: var(--live); font-weight: 600; }
.game .atbet { font-size: 11.5px; color: var(--faint); }
.res { display: inline-block; font: 700 12px/1 var(--f-text); text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 6px; }
.res.win, .res.half_win { background: var(--win-soft); color: var(--win); }
.res.loss, .res.half_loss { background: var(--loss-soft); color: var(--loss); }
.res.push, .res.void { background: var(--push-soft); color: var(--push); }
.res.cashed { background: var(--cashed-soft); color: var(--cashed); }
.res.pending { background: var(--panel3); color: var(--pending); }
.prov { font-size: 11px; font-weight: 700; }
.prov.win { color: var(--win); } .prov.loss { color: var(--loss); } .prov.push { color: var(--push); }
select.ressel { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 6px; font-size: 12px; }
.more { padding: 12px; text-align: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* today */
.today-games { display: grid; gap: 8px; }
.tg { border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
.tg > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tg > summary::-webkit-details-marker { display: none; }
.tg .tname { font-weight: 600; }
.tg .tnums { margin-left: auto; display: flex; gap: 14px; align-items: baseline; font-size: 13px; }
.tg .tbody { padding: 4px 12px 10px; border-top: 1px solid var(--line); }
.tg .tbet { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; align-items: center; }
.tg .tbet:last-child { border-bottom: 0; }
.tg .tbet .grow { flex: 1; min-width: 0; }
.tg .tfoot { font-size: 12.5px; color: var(--muted); padding-top: 7px; }
.brief { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.brief b { color: var(--text); }

/* breakdown */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 5px 10px; font-size: 13px; color: var(--muted); font-weight: 500; }
.tabs button.on { background: var(--panel3); color: var(--text); border-color: var(--line2); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(5,7,12,.6); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.modal[hidden] { display: none; }
.modal-card { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 760px; }
.modal-card.wide { max-width: 1000px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0 auto 0 0; font: 700 19px/1 var(--f-num); text-transform: uppercase; letter-spacing: .04em; }
.modal-body { padding: 14px 16px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }
.form label, .fl { display: grid; gap: 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.form input, .form select, .form textarea, .fl input, .fl select, .fl textarea { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 6px 8px; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 400; width: 100%; }
.form .span2 { grid-column: span 2; } .form .spanall { grid-column: 1 / -1; }
textarea.big { min-height: 220px; font: 12.5px/1.5 var(--f-mono); }
.legbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; background: var(--panel2); }
.legbox h4 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.section-title { font: 700 14px var(--f-num); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 8px; }
.pick-list { display: grid; gap: 6px; margin-top: 10px; max-height: 360px; overflow-y: auto; }
.pick { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); flex-wrap: wrap; }
.pick .grow { flex: 1; min-width: 160px; }
.diff { font: 12px var(--f-mono); }
.diff del { color: var(--loss); text-decoration: line-through; } .diff ins { color: var(--win); text-decoration: none; }
.helpgrid { display: grid; gap: 6px; }
.helpgrid code { font: 13px var(--f-mono); background: var(--panel3); padding: 2px 6px; border-radius: 5px; }

/* "My bets": the four numbers + today's games and what's still to come, grouped by game */
.sl-sum { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.sl-sum > div { padding: 14px 10px 12px; text-align: center; border-left: 1px solid var(--line); min-width: 0; }
.sl-sum > div:first-child { border-left: 0; }
.sl-sum .v { font: 600 34px/1 var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sl-sum .k { margin-top: 6px; font: 600 12px/1 var(--f-text); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sl-sum .s { margin-top: 4px; font-size: 11.5px; color: var(--faint); }
#slate { padding: 6px 14px 14px; }
.sl-game { margin-top: 8px; }
.sl-gh { display: flex; align-items: center; gap: 10px; padding: 8px 2px; cursor: pointer; user-select: none; }
.sl-gh .car { width: 14px; height: 14px; color: var(--muted); transition: transform .15s; flex: none; }
.sl-game.shut .car { transform: rotate(-90deg); }
.sl-game.shut .sl-rows { display: none; }
.sl-team { display: inline-flex; align-items: center; gap: 6px; font: 700 17px/1 var(--f-num); letter-spacing: .02em; white-space: nowrap; }
.sl-logo { width: 24px; height: 24px; object-fit: contain; flex: none; }
.sl-mono { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 9.5px/1 var(--f-text); color: #fff; flex: none; background: #555e70; }
.sl-at { color: var(--faint); font: 600 13px/1 var(--f-text); }
.sl-lg { font: 600 10.5px/1 var(--f-text); color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
.sl-gh .rule { flex: 1; height: 1px; background: var(--line2); min-width: 16px; }
.sl-when { font: 600 15px/1 var(--f-num); white-space: nowrap; letter-spacing: .02em; }
.sl-when.live { color: var(--live); }
.sl-when.live::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 6px; vertical-align: 2px; animation: slpulse 1.4s infinite; }
@keyframes slpulse { 50% { opacity: .3; } }
.sl-when.final { color: var(--muted); }
.sl-rows { display: flex; flex-direction: column; gap: 6px; }
.sl-row { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .12s; }
.sl-row:hover { border-color: var(--line2); }
.sl-r1 { display: grid; grid-template-columns: 1fr auto 88px; align-items: center; gap: 16px; padding: 10px 14px; }
.sl-mk { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.sl-mk .t { font: 700 19px/1.1 var(--f-num); letter-spacing: .015em; }
.sl-mk .o { font: 600 19px/1.1 var(--f-num); color: var(--muted); }
.sl-pill { display: inline-block; font: 600 10.5px/1 var(--f-text); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; background: var(--panel3); color: var(--muted); white-space: nowrap; }
.sl-pill.avg { background: var(--accent-soft); color: var(--accent); }
.sl-more { font-size: 12px; color: var(--accent); white-space: nowrap; }
.sl-money { display: flex; gap: 20px; text-align: center; }
.sl-money .v { font: 600 20px/1 var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sl-money .k { font-size: 12px; color: var(--muted); margin-top: 3px; }
.sl-money .sl-orig { font: 600 11.5px/1.2 var(--f-text); color: var(--warn); margin-top: 2px; white-space: nowrap; }
.sl-r1 .res { justify-self: end; }
.res.mixed { background: var(--warn-soft); color: var(--warn); }
.sl-legs { padding: 0 14px 10px; margin-top: -2px; display: grid; gap: 3px; }
.sl-legs div { font-size: 13px; color: var(--muted); }
.sl-subs { display: none; border-top: 1px solid var(--line); padding: 2px 14px 6px; cursor: default; }
.sl-row.open .sl-subs { display: block; }
.sl-sub { display: grid; grid-template-columns: 1fr 70px 150px 150px 130px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.sl-sub:last-child { border-bottom: 0; }
.sl-sub:not(.hd):hover .raw { color: var(--text); }
.sl-sub .n { font: 600 16px/1 var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.sl-sub .raw { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-sub.hd { cursor: default; }
.sl-sub.hd span { font: 600 10.5px/1 var(--f-text); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; text-align: right; }
.sl-sub.hd span:first-child { text-align: left; }
.sl-empty { padding: 18px 4px 8px; color: var(--muted); }
.act { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.sl-act { padding: 0 14px 10px; margin-top: -4px; }
.leg-line .act { font-size: 12px; margin-left: 4px; }
#slatePanel .panel-head h2 { margin-right: 0; }
#slateDate { margin-right: auto; }
.sl-periods { display: flex; gap: 6px; flex-wrap: wrap; }
.sl-periods button { border: 1px solid var(--line2); background: var(--panel2); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 12.5px; }
.sl-periods button:hover { background: var(--panel3); }
.sl-periods button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sl-range { display: none; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sl-range.show { display: inline-flex; }
.sl-range input { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 3px 6px; font-size: 13px; }
.sl-day { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sl-dh { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: var(--panel2); cursor: pointer; user-select: none; }
.sl-dh .car { width: 14px; height: 14px; color: var(--muted); transition: transform .15s; flex: none; }
.sl-day.shut .sl-dh .car { transform: rotate(-90deg); }
.sl-day.shut .sl-db { display: none; }
.sl-dh .dn { font: 700 18px/1 var(--f-num); letter-spacing: .02em; text-transform: uppercase; }
.sl-dh .ds { color: var(--muted); font-size: 13px; margin-right: auto; }
.sl-dh .dnet { font: 600 20px/1 var(--f-num); font-variant-numeric: tabular-nums; }
.sl-dh .drec { font: 600 15px/1 var(--f-num); color: var(--muted); min-width: 64px; text-align: right; }
.sl-db { padding: 0 12px 10px; }
.sl-day .sl-row { background: var(--panel); }

/* Analysis: five numbers + breakdown by league and bet type, above the full table */
.pnl { border-top: 1px solid var(--line); padding: 14px 16px 16px; position: relative; }
.pnl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 8px; }
.pnl-seg { margin-left: auto; }
.pnl-head h3 { margin: 0; font: 600 13px/1.2 var(--f-text); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pnl-head .pnl-k { font-size: 12.5px; color: var(--muted); }
.pnl-head .pnl-k b { font: 600 16px/1 var(--f-num); font-variant-numeric: tabular-nums; color: var(--text); margin-left: 4px; }
.pnl-head .pnl-k b.pos { color: var(--win); } .pnl-head .pnl-k b.neg { color: var(--loss); }
.pnl svg { display: block; width: 100%; height: auto; overflow: visible; }
.pnl .ax { font: 11px var(--f-text); fill: var(--faint); font-variant-numeric: tabular-nums; }
.pnl .grid { stroke: var(--line); stroke-width: 1; }
.pnl .zero { stroke: var(--line2); stroke-width: 1; }
.pnl .cum { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pnl .cum-area { fill: var(--accent-soft); stroke: none; }
.pnl .bar-w { fill: var(--win); } .pnl .bar-l { fill: var(--loss); }
.pnl .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.pnl .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.pnl-tip { position: absolute; pointer-events: none; background: var(--panel3); border: 1px solid var(--line2); border-radius: 8px;
  padding: 8px 10px; font-size: 12.5px; line-height: 1.5; box-shadow: var(--shadow); white-space: nowrap; z-index: 5; }
.pnl-tip .t { font-weight: 600; margin-bottom: 2px; }
.pnl-tip .r { display: flex; justify-content: space-between; gap: 14px; } .pnl-tip .r span:first-child { color: var(--muted); }
.pnl-tip .r b { font-variant-numeric: tabular-nums; font-weight: 600; }
.pnl-empty { color: var(--muted); font-size: 13px; padding: 6px 0 2px; }
.an-sum { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.an-sum > div { padding: 12px 10px 10px; text-align: center; border-left: 1px solid var(--line); min-width: 0; }
.an-sum > div:first-child { border-left: 0; }
.an-sum .v { font: 600 30px/1 var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.an-sum .k { margin-top: 6px; font: 600 11.5px/1 var(--f-text); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.an-sum .s { margin-top: 4px; font-size: 11.5px; color: var(--faint); }
.an-break { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.an-break:empty { display: none; }
.an-tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-height: 320px; overflow-y: auto; }
.an-tbl table { width: 100%; }
.an-tbl td, .an-tbl th { padding: 6px 10px; }
@media (max-width: 900px) { .an-sum { grid-template-columns: repeat(2, 1fr); } .an-break { grid-template-columns: 1fr; } }

/* toasts */
#toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; width: min(560px, calc(100% - 32px)); }
.toast { background: var(--panel3); border: 1px solid var(--line2); box-shadow: var(--shadow); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; animation: up .18s ease-out; }
.toast.bad { border-color: var(--loss); } .toast.good { border-color: color-mix(in srgb, var(--win) 60%, transparent); }
.toast .grow { flex: 1; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

@media (max-width: 720px) {
  .top { position: static; }
  .hbtns .btn { padding: 5px 9px; }
  #entry { font-size: 16px; }
  .brand h1 { font-size: 19px; }
  .hide-sm { display: none; }
  th, td { padding: 7px 8px; }
  .form .span2 { grid-column: auto; }
  .tg .tnums { margin-left: 0; width: 100%; }
  .tile .val { font-size: 24px; }
}

/* ---------- phone (iPhone and other narrow screens) ---------- */
.show-sm { display: none !important; }
@media (max-width: 640px) {
  .show-sm { display: flex !important; }
  .wrap { padding: 0 10px; }
  .top .wrap { min-height: 0; gap: 6px; padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: 8px; }
  .brand .build, #btnImport { display: none; }
  .hbtns { width: 100%; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .hbtns::-webkit-scrollbar { display: none; }
  .hbtns > * { flex: none; }
  .btn, .savechip { min-height: 36px; }
  .btn.small { min-height: 32px; }
  /* iPhone zooms the whole page into any box with text under 16px — keep every field at 16px */
  input, select, textarea, .form input, .form select, .form textarea, .fl input, .fl select, .fl textarea,
  .filters select, .filters input, .sl-range input, select.ressel, .bulkbar input, .bulkbar select, .editor input, .editor select { font-size: 16px; }
  .banner { padding: 10px 12px; }
  .banner .grow { min-width: 0; flex-basis: 100%; }

  /* entry */
  .entry { margin-top: 10px; padding: 10px; border-radius: 12px; }
  #entry { min-height: 64px; font-size: 16px; padding: 10px 12px; }
  .entry-actions { gap: 8px; margin-top: 8px; }
  .entry-actions .btn.primary { flex: 1; font-size: 15px; }
  .pv-leg, .fchip { font-size: 14px; }

  /* panels */
  .panel { margin-top: 10px; border-radius: 12px; }
  .panel-head { padding: 10px 12px; gap: 8px; }

  /* My Bets */
  #slateDate { flex-basis: 100%; margin: 0; font-size: 13px; }
  .sl-periods { flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sl-periods::-webkit-scrollbar { display: none; }
  .sl-periods button { flex: none; min-height: 34px; }
  .sl-range.show { width: 100%; flex-wrap: wrap; }
  .sl-sum { grid-template-columns: repeat(2, 1fr); }
  .sl-sum > div { padding: 10px 6px; border-left: 0; }
  .sl-sum > div:nth-child(2n) { border-left: 1px solid var(--line); }
  .sl-sum > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .sl-sum .v { font-size: 26px; }
  .sl-sum .k { font-size: 11px; }
  #slate { padding: 4px 10px 12px; }
  .sl-gh { flex-wrap: wrap; gap: 4px 8px; padding: 8px 0; }
  .sl-gh .rule { display: none; }
  .sl-team { font-size: 16px; }
  .sl-logo, .sl-mono { width: 22px; height: 22px; }
  .sl-when { flex-basis: 100%; padding-left: 22px; font-size: 14px; }
  .sl-r1 { grid-template-columns: 1fr auto; grid-template-areas: "mk mk" "money res"; gap: 8px 10px; padding: 10px 12px; }
  .sl-mk { grid-area: mk; }
  .sl-mk .t, .sl-mk .o { font-size: 18px; }
  .sl-money { grid-area: money; gap: 18px; text-align: left; }
  .sl-money .v { font-size: 19px; }
  .sl-r1 .res { grid-area: res; align-self: center; }
  .sl-legs, .sl-act { padding-left: 12px; padding-right: 12px; }
  .sl-subs { padding: 2px 12px 6px; }
  .sl-sub { grid-template-columns: repeat(3, 1fr) auto; gap: 4px 10px; padding: 8px 0; }
  .sl-sub.hd { display: none; }
  .sl-sub .raw { grid-column: 1 / -1; white-space: normal; }
  .sl-sub .n { text-align: left; font-size: 15px; }
  .sl-dh { flex-wrap: wrap; gap: 4px 10px; padding: 10px 12px; }
  .sl-dh .dn { font-size: 16px; }
  .sl-dh .ds { order: 9; flex-basis: 100%; padding-left: 24px; margin: 0; font-size: 12.5px; }
  .sl-dh .dnet { margin-left: auto; font-size: 18px; }
  .sl-dh .drec { min-width: 0; }
  .sl-db { padding: 0 8px 8px; }

  /* Analysis */
  .filters { width: 100%; }
  .filters select, .filters input, .filters input[type=search] { max-width: none; width: auto; flex: 1 1 140px; min-height: 36px; }
  .seg { width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; min-height: 34px; }
  .an-sum > div { border-left: 0; }
  .an-sum > div:nth-child(2n) { border-left: 1px solid var(--line); }
  .an-sum > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .an-sum > div:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .an-sum .v { font-size: 24px; }
  .an-break { padding: 10px; gap: 10px; }
  .an-tbl { overflow: auto; }
  .an-tbl td, .an-tbl th { padding: 6px 7px; font-size: 13px; }
  .an-tbl th:nth-child(4), .an-tbl td:nth-child(4) { display: none; }   /* Volume — the total is in the box above */
  .bulkbar { position: static; }
  /* the full bet table becomes one card per bet */
  #tableWrap table, #tableWrap tbody { display: block; }
  #tableWrap thead { display: none; }
  #tableWrap tbody tr { display: grid; grid-template-columns: 24px 1fr auto auto; grid-template-areas: "sel bet bet bet" "sel game game game" "sel placed odds stake" "sel res pl pl";
    gap: 6px 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  #tableWrap tbody tr.sel, #tableWrap tbody tr:hover { background: var(--panel2); }

  #tableWrap td:nth-child(5) { grid-area: odds; }

  #tableWrap td:nth-child(7) { grid-area: res; }
  #tableWrap td:nth-child(8) { grid-area: pl; text-align: right; font-size: 16px; }
  .pnl { padding: 12px 10px 14px; }
  .pnl-seg { margin-left: 0; width: 100%; }

  .form { grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .form .span2, .form .spanall { grid-column: 1 / -1; }
  .pick .grow { min-width: 0; flex-basis: 100%; }
  /* the little chip editor opens as a bar at the bottom of the screen */
  .editor { position: fixed !important; left: 8px !important; right: 8px; top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .editor input, .editor select { flex: 1 1 160px; min-width: 0; }
  #toasts { bottom: calc(12px + env(safe-area-inset-bottom)); width: calc(100% - 20px); }
}

<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Bet Tracker</h1><span class="build" id="build"></span></div>
    <span class="sync" id="sync"></span>
    <div class="hbtns">
      <button class="btn cloudchip" id="btnCloud">☁ Sign in</button>
      <button class="savechip" id="saveChip" title="Auto-save status"><span class="dot"></span><span id="saveChipText">…</span></button>
      <button class="btn" id="btnBackup" title="Download a backup file of every bet">Backup</button>
      <button class="btn" id="btnRestore" title="Load bets from a backup file">Restore</button>
      <button class="btn" id="btnImport" title="Import bets from a Telegram chat export (result.json)">Import chat</button>
      <button class="btn hide-sm" id="btnCsv" title="Spreadsheet export">CSV</button>
      <button class="btn" id="btnTools">Tools</button>
      <button class="btn" id="btnSettings">Settings</button>
      <button class="btn" id="btnHelp" title="How to talk to it">Help</button>
      <button class="btn ghost" id="btnTheme" title="Light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>
<main class="wrap" style="padding-bottom:80px">
  <div id="banners"></div>
  <section class="entry">
    <textarea id="entry" autofocus spellcheck="false" placeholder="Say or type a bet…   e.g.  Bills -3, -110, $500 on DraftKings, tail Hitman"></textarea>
    <div class="entry-actions show-sm">
      <button class="btn primary" id="btnSaveEntry">Save bet</button>
      <button class="btn" id="btnSaveForce" title="Save even if some parts look unclear">Save anyway</button>
      <button class="btn ghost" id="btnClearEntry">Clear</button>
    </div>
    <div class="hint hide-sm">
      <span><kbd>Enter</kbd> save</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span><span><kbd>Esc</kbd> clear</span>
      <span><kbd>Ctrl</kbd>+<kbd>K</kbd> back here</span><span><kbd>Win</kbd>+<kbd>H</kbd> dictate</span><span>Tap any chip below to fix it</span>
    </div>
    <div class="hint show-sm"><span>Tap the 🎤 on your keyboard to dictate · tap any chip below to fix it</span></div>
    <div id="preview" class="preview"></div>
  </section>
  <section class="panel" id="slatePanel">
    <div class="panel-head"><h2>My Bets</h2><span class="muted" id="slateDate"></span>
      <div class="sl-periods" id="slatePeriods"></div>
      <span class="sl-range" id="slateRange">From <input type="date" id="slateFrom"> to <input type="date" id="slateTo"></span>
    </div>
    <div class="sl-sum" id="slateSum"></div>
    <div id="slate"></div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <h2>Analysis</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="an-sum" id="anSum"></div>
    <div class="an-break" id="anBreak"></div>
    <div class="table-wrap" id="tableWrap"></div>
    <div class="pnl" id="anChart"></div>
  </section>
</main>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="toasts"></div>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

}

/* Hand grading — final: the auto-grader never overwrites it */
function findBet(id) { return state.bets.filter(function (b) { return b.id === id; })[0]; }
function handGrade(id, result) {
  var b = findBet(id); if (!b) return;
  if (result === 'cashed') {
    modalForm('Cashed out', '<div class="form"><label>Book paid back (total, incl. stake)<input id="coAmt" type="number" step="0.01" value="' + esc(b.cashOut || '') + '"></label></div><p class="muted">Profit = amount returned − stake (' + fmtMoney(b.stake, { cur: b.currency }) + ').</p>', 'Save', function () {
      var v = +$('#coAmt').value; if (!(v >= 0)) { toast('Enter the amount the book paid back', 'bad'); return false; }
      setGrade(b, 'cashed', v);
    }, function () { renderTable(); });
    return;
  }
  setGrade(b, result);
}
function setGrade(b, result, cashOut) {
  var before = JSON.stringify(state.bets);
  if (result === 'pending') { b.result = 'pending'; b.profit = null; b.gradedBy = null; b.gradedAt = null; b.cashOut = null; }
  else {
    b.result = result; if (result === 'cashed') b.cashOut = cashOut;
    b.profit = G.profitFor(result, b.stake, b.odds, b.cashOut);
    b.gradedBy = 'manual'; b.gradedAt = new Date().toISOString(); b.needsReview = false;
  }
  b.updatedAt = new Date().toISOString();
  saveBets(); renderAll();
  toast(resLabel(b.result) + ': ' + b.legs.map(legText).join(' + '), '', { undo: function () { state.bets = JSON.parse(before); saveBets(); renderAll(); } });
  // a hand grade or cash-out usually means the game (or half) just ended — ask the feed now
  b.legs.forEach(function (l) { if (l.eventId) board(l.eventLeague, espnDay(l.eventDate), { fresh: true }).then(function () { var ev = evIndex[l.eventId]; if (ev && applyEvent(l, ev)) { saveBets(); renderAll(); } }).catch(function () {}); });
}

/* Backup / restore / CSV */
function download(name, text, type) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function stamp() { var d = new Date(); return localYmd(d) + '-' + pad(d.getHours()) + pad(d.getMinutes()); }
function doBackup() { download('bet-tracker-backup-' + stamp() + '.json', payload()); toast('Backup downloaded (' + state.bets.length + ' bets). Keep it somewhere safe, like your Documents folder.', 'good'); }
function mergeBets(incoming) {
  var byId = {}, added = 0, updated = 0, same = 0, noId = 0;
  state.bets.forEach(function (b) { byId[b.id] = b; });
  incoming.forEach(function (b) {
    if (!b || !b.legs) return;
    if (!b.id) { b.id = uid(); noId++; }
    var cur = byId[b.id];
    if (!cur) { byId[b.id] = b; added++; }
    else if ((b.updatedAt || b.createdAt || '') > (cur.updatedAt || cur.createdAt || '')) { byId[b.id] = b; updated++; }
    else same++;
  });
  var list = Object.keys(byId).map(function (k) { return byId[k]; });
  list.sort(function (a, b) { return (b.createdAt || '') < (a.createdAt || '') ? -1 : 1; });
  return { list: list, added: added, updated: updated, same: same, noId: noId };
}
function doRestore(file) {
  file.text().then(function (t) {
    var j = JSON.parse(t), arr = Array.isArray(j) ? j : j.bets;
    if (!Array.isArray(arr)) throw new Error('no bets in that file');
    var m = mergeBets(arr);
    modalConfirm('Restore from backup', '<p><b>' + esc(file.name) + '</b> holds ' + arr.length + ' bets.</p><ul><li>' + m.added + ' new — will be added</li><li>' + m.updated + ' newer than yours — will replace yours</li><li>' + m.same + ' already here</li></ul><p class="muted">Nothing is deleted. You can undo this right after.</p>', 'Merge them in', function () {

}
/* Import from a Telegram chat export: every message is read like a paste, dated when it was sent. */
function openChatImport(file) {
  file.text().then(function (t) {
    var msgs = P.readTelegram(JSON.parse(t));
    if (!msgs.length) throw new Error('no messages in it. In Telegram Desktop use ⋮ → Export chat history, format "Machine-readable JSON"');
    var have = {}, dupes = 0, found = [];
    state.bets.forEach(function (b) { if (b.importKey) have[b.importKey] = 1; });
    msgs.forEach(function (m) {
      P.betsInText(m.text, { today: localYmd(m.at), defaults: parserDefaults(), isTeam: isKnownTeam }).forEach(function (x, j) {
        var key = m.key + ':' + j;
        if (have[key]) { dupes++; return; }
        var b = x.r.bet;
        found.push({ key: key, m: m, b: b, issues: x.r.issues, good: x.r.confidence >= 0.8 && b.odds != null && !!b.stakeInput });
      });
    });
    found.sort(function (a, b) { return b.m.at - a.m.at; });

function toolReparse() {

    var fields = [];
    function cmp(k, a, c, money) { if (String(a == null ? '' : a) !== String(c == null ? '' : c)) fields.push({ k: k, from: a, to: c, money: money }); }
    cmp('sport', b.sport, r.sport || b.sport); cmp('odds', b.odds, r.odds, true); cmp('stake', b.stake, r.stake, true); cmp('currency', b.currency, r.currency, true);
    cmp('book', b.book, r.book || b.book); cmp('source', b.source, r.source || b.source); cmp('live', !!b.live, !!r.live); cmp('hedge', !!b.hedge, !!r.hedge); cmp('kind', b.kind, r.kind);

    function who(l) { return [l.team, l.opponent].filter(Boolean).map(P.titleCase).join(' vs ') || P.titleCase(l.player || ''); }
    var legsDiffer = b.legs.length !== r.legs.length || b.legs.some(function (l, i) { return legKey(l, !l.eventId) !== legKey(r.legs[i], !l.eventId); });

      if (lt === rt) { lt = b.legs.map(who).join(' + '); rt = r.legs.map(who).join(' + '); }
      fields.push({ k: 'legs', from: lt, to: rt, legs: r.legs });
    }
    if (fields.length) changes.push({ b: b, r: r, fields: fields });

function toolSweep() {

    var created = new Date(b.createdAt);
    if (created.getHours() < 6 && l.eventDay === P.addDays(b.placedDate, -1)) return false;  // before 6am on last night's game
    if (b.live && l.atBet) return false;                                     // logged while the game was running
    if (b.live && Math.abs(Date.parse(l.eventDate) - created.getTime()) < 6 * 3600000) return false;
    return true;
  });

function toolRecoverWith(fileText, fileName, idbSnapList) {
  var have = {}; state.bets.forEach(function (b) { have[b.id] = 1; });
  var found = {}, sources = [];
  function scan(label, arr) {
    if (!Array.isArray(arr)) return;
    var n = 0;
    arr.forEach(function (b) { if (b && b.id && b.legs && !have[b.id] && !found[b.id]) { found[b.id] = b; n++; } });
    sources.push(label + ': ' + arr.length + ' bets, ' + n + ' not in your list');
  }
  Object.keys(localStorage).forEach(function (k) {
    if (k === LS_BETS || k.indexOf('bt.') !== 0) return;
    try { var v = JSON.parse(localStorage.getItem(k)); scan(k, Array.isArray(v) ? v : v && v.bets); } catch (e) {}
  });
  (idbSnapList || []).forEach(function (s) { try { scan('daily copy ' + String(s.key).slice(IDB_SNAP.length), JSON.parse(s.json)); } catch (e) {} });
  if (fileText) { try { var j = JSON.parse(fileText); scan(fileName, Array.isArray(j) ? j : j.bets); } catch (e) { sources.push(fileName + ': unreadable'); } }
  var list = Object.keys(found).map(function (k) { return found[k]; });
  var h = '<ul>' + sources.map(function (s) { return '<li class="mono">' + esc(s) + '</li>'; }).join('') + (sources.length ? '' : '<li>No snapshots found.</li>') + '</ul>';
  if (!list.length) { modalShell('Recover bets', h + '<p>Nothing missing — every bet found is already in your list.</p>', '<button class="btn" data-close>Close</button>'); return; }
  h += '<p><b>' + list.length + ' bets</b> can be brought back:</p><div class="pick-list">' + list.slice(0, 200).map(function (b) { return '<div class="pick"><span class="grow">' + esc(b.placedDate + ' · ' + b.legs.map(legText).join(' + ')) + '</span><span class="num">' + fmtMoney(b.stake, { cur: b.currency }) + '</span></div>'; }).join('') + '</div>';
  modalShell('Recover bets', h, '<button class="btn" data-close>Cancel</button><button class="btn primary" id="rcApply">Bring them back</button>', true);
  $('#rcApply').onclick = function () {
    var before = JSON.stringify(state.bets);
    state.bets = mergeBets(list).list; canonicalise(); saveBets(); closeModal(); renderAll();
    log('recovered ' + list.length + ' bets');
    toast('Recovered ' + list.length + ' bets', 'good', { undo: function () { state.bets = JSON.parse(before); saveBets(); renderAll(); } });
  };
}

/* Toasts */
function toast(msg, kind, opts) {
  opts = opts || {};
  var t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = '<span class="grow">' + esc(msg) + '</span>' + (opts.undo ? '<button class="btn small">Undo</button>' : '') + '<button class="btn small ghost" aria-label="Dismiss">✕</button>';
  $('#toasts').appendChild(t);
  var kill = function () { if (t.parentNode) t.remove(); };
  if (opts.undo) t.querySelector('.btn').onclick = function () { opts.undo(); kill(); toast('Undone'); };
  t.querySelector('.btn.ghost').onclick = kill;
  setTimeout(kill, opts.undo ? 9000 : 5000);
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
}

// a parlay whose legs are all on one game is a same game parlay, said or not
function markSgp(b) {
  if (b.kind !== 'parlay' || !b.legs || b.legs.length < 2) return false;
  var id = b.legs[0].eventId;
  if (!id || !b.legs.every(function (l) { return l.eventId === id; })) return false;
  b.tags = b.tags || [];
  if (b.tags.indexOf('sgp') >= 0) return false;
  b.tags.push('sgp'); return true;
}
function canonicalise() {
  state.bets.forEach(function (b) {
    if (!b.id) b.id = uid();
    if (b.source) b.source = P.resolveSource(b.source);
    if (b.book) b.book = P.resolveBook(b.book);
    if (!b.result) b.result = 'pending';
    // hockey "shots on goal" used to be saved as soccer's shots on target, which kept those legs off NHL rosters
    (b.legs || []).forEach(function (l) { if (l.stat === 'sot' && (b.sport === 'NHL' || l.eventLeague === 'NHL')) l.stat = 'sog'; });
    markSgp(b);
    // rugby clubs saved with ESPN's wrong country flag (Canterbury = Canada's): no logo instead
    (b.legs || []).forEach(function (l) {
      if (l.eventLeague !== 'RUGBY') return;
      if (/\/countries\//.test(l.homeLogo || '') && !G.rugbyNation(l.homeName)) l.homeLogo = '';
      if (/\/countries\//.test(l.awayLogo || '') && !G.rugbyNation(l.awayName)) l.awayLogo = '';
    });
  });
}

/* =================== boot =================== */
function wireSlate() {
  $('#slatePeriods').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-p]'); if (!b) return;
    slateUi.period = b.getAttribute('data-p'); renderSlate();
  });
  $('#slateFrom').addEventListener('change', function () { slateUi.from = this.value || null; renderSlate(); });
  $('#slateTo').addEventListener('change', function () { slateUi.to = this.value || null; renderSlate(); });
  $('#slate').addEventListener('click', function (e) {
    var dh = e.target.closest('.sl-dh');
    if (dh) { var dk = dh.parentNode.getAttribute('data-d'); slateUi.shut[dk] = !dh.parentNode.classList.contains('shut'); renderSlate(); return; }
    var sub = e.target.closest('.sl-sub[data-id]'); if (sub) { openEdit(sub.getAttribute('data-id')); return; }
    if (e.target.closest('.sl-subs')) return;
    var gh = e.target.closest('.sl-gh');
    if (gh) { var g = gh.parentNode, k = g.getAttribute('data-g'); slateUi.shut[k] = !slateUi.shut[k]; g.classList.toggle('shut', !!slateUi.shut[k]); return; }
    var row = e.target.closest('.sl-row'); if (!row) return;
    if (row.hasAttribute('data-fold')) { var fk = row.getAttribute('data-fold'); slateUi.open[fk] = !slateUi.open[fk]; row.classList.toggle('open', !!slateUi.open[fk]); return; }
    if (row.hasAttribute('data-id')) openEdit(row.getAttribute('data-id'));
  });
}
function boot() {
  wireSlate();
  $('#build').textContent = 'build ' + BUILD;
  state.settings = loadSettings();
  applySettings();
  state.bets = [];
  if (!fsSupported) state.fileState = 'unsupported';
  cloud.session = cloudLoadSession();
  renderCloudChip(); renderSaveChip();
  loadBetsBest().then(function (bets) {
    state.bets = bets; state.loaded = true;
    canonicalise();
    queueFileSave();
    renderAll();
    cloudStart();
    refreshFx(false);
    refresh({});
    setInterval(function () { refresh({}); cloudSync(); }, 60000);
    setInterval(function () { refreshFx(false); }, 3600000);
    if (!state.bets.length && !localStorage.getItem('bt.seenHelp')) { tryWrite('bt.seenHelp', '1'); openHelp(); }
  });
  var entry = $('#entry');
  entry.addEventListener('input', function () { clearTimeout(pvTimer); pvTimer = setTimeout(reparse, 120); });
  entry.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(true); }
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(false); }
    else if (e.key === 'Escape') { e.preventDefault(); clearEntry(); }
  });
  // phone: no Shift+Enter / Ctrl+Enter on a phone keyboard, so the entry box has its own buttons
  $('#btnSaveEntry').onclick = function () { commit(false); };
  $('#btnSaveForce').onclick = function () { commit(true); };
  $('#btnClearEntry').onclick = function () { clearEntry(); };
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); closeModal(); entry.focus(); }
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  });
  $('#saveChip').onclick = onSaveChip;
  $('#btnBackup').onclick = doBackup;
  $('#btnRestore').onclick = function () { $('#fileRestore').click(); };
  $('#fileRestore').onchange = function () { if (this.files[0]) doRestore(this.files[0]); this.value = ''; };
  $('#btnCsv').onclick = doCsv;
  $('#btnImport').onclick = function () {
    var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () { if (i.files[0]) openChatImport(i.files[0]); };
    i.click();
  };
  $('#btnTools').onclick = openTools;
  $('#btnSettings').onclick = openSettings;
  $('#btnHelp').onclick = openHelp;
  $('#btnTheme').onclick = function () {
    var cur = state.settings.theme, dark = cur === 'dark' || (cur === 'auto' && !window.matchMedia('(prefers-color-scheme: light)').matches);
    state.settings.theme = dark ? 'light' : 'dark'; saveSettings();
  };
  if (fsSupported) {
    idbGet('fileHandle').then(function (h) {
      if (!h) { setFileState('none'); return; }
      state.fileHandle = h;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) { if (p === 'granted') writeFile(); else setFileState('perm'); });
    }).catch(function (e) { log('file handle unavailable: ' + e.message); setFileState('none'); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.loaded) { refresh({}); cloudSync(); } });
  $('#btnCloud').onclick = openCloud;
}
boot();
})();
</script>
